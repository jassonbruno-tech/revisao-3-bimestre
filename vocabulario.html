<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulário — 6º Ano</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#17479b,#07142f 55%,#16042d);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:#fff;text-decoration:none;font-weight:900}.card{background:#0b1740e8;border:1px solid #ffffff25;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 16px 40px #0005}h1{color:#ffe66d}.btn,button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.btn{background:linear-gradient(135deg,#ffe66d,#ffb703);color:#172033}.muted{color:#cbd5e1}.result{font-size:20px;font-weight:900;color:#ffe66d}.credit{text-align:center;color:#cbd5e1;font-size:12px;margin:18px}</style><style>.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.col{display:grid;gap:7px}.word{background:#fff;color:#173b70}.sel{outline:4px solid #ffe66d}.ok{background:#4ade80!important}.hud{display:flex;justify-content:space-between;font-weight:900}</style><div class="wrap"><div class="top"><a class="back" href="index.html">← HUB</a><b>6º ANO</b></div><div class="card"><h1>🧩 Combinação de Vocabulário</h1><div class="hud"><span id="h">0/40 pares</span><span id="e">0 erros</span></div><p class="muted">Selecione uma palavra em inglês e sua tradução.</p><div class="board"><div class="col" id="l"></div><div class="col" id="r"></div></div><p id="msg" class="result"></p></div><div class="credit">Prof. Jasson Bruno</div></div><script>const B=[["mother","mãe"],["father","pai"],["sister","irmã"],["brother","irmão"],["grandmother","avó"],["grandfather","avô"],["aunt","tia"],["uncle","tio"],["cousin","primo / prima"],["living room","sala de estar"],["bedroom","quarto"],["bathroom","banheiro"],["kitchen","cozinha"],["dining room","sala de jantar"],["laundry room","lavanderia"],["hallway","corredor"],["front yard","área da frente"],["backyard","quintal dos fundos"],["garden","jardim"],["garage","garagem"],["gate","portão"],["roof","telhado"],["wall","parede / muro"],["balcony","varanda"],["sofa","sofá"],["bed","cama"],["table","mesa"],["chair","cadeira"],["fridge","geladeira"],["stove","fogão"],["sink","pia"],["shower","chuveiro"],["window","janela"],["door","porta"],["desk","escrivaninha"],["lamp","lâmpada / abajur"],["house","casa"],["room","cômodo / quarto"],["family","família"],["home","lar / casa"]];let order=[...B].sort(()=>Math.random()-.5),done=0,err=0,visible=[],a=null,b=null;function mix(x){return [...x].sort(()=>Math.random()-.5)}function fill(){while(visible.length<6&&order.length)visible.push(order.shift());render()}function render(){l.innerHTML='';r.innerHTML='';mix(visible).forEach(p=>{let x=document.createElement('button');x.className='word';x.textContent=p[0];x.onclick=()=>pick(0,p,x);l.appendChild(x)});mix(visible).forEach(p=>{let x=document.createElement('button');x.className='word';x.textContent=p[1];x.onclick=()=>pick(1,p,x);r.appendChild(x)});h.textContent=done+'/40 pares';e.textContent=err+' erros'}function pick(side,p,x){if(side===0){a={p,x};[...l.children].forEach(z=>z.classList.remove('sel'));x.classList.add('sel')}else{b={p,x};[...r.children].forEach(z=>z.classList.remove('sel'));x.classList.add('sel')}if(a&&b){if(a.p[0]===b.p[0]){a.x.classList.add('ok');b.x.classList.add('ok');let key=a.p[0];setTimeout(()=>{visible=visible.filter(q=>q[0]!==key);done++;a=b=null;if(done===40){msg.textContent='🎉 Concluído! 40 pares encontrados • '+err+' erros.';render()}else fill()},350)}else{err++;a.x.classList.remove('sel');b.x.classList.remove('sel');a=b=null;render()}}}fill()</script>
