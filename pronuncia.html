<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronúncia — 6º Ano</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#17479b,#07142f 55%,#16042d);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:#fff;text-decoration:none;font-weight:900}.card{background:#0b1740e8;border:1px solid #ffffff25;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 16px 40px #0005}h1{color:#ffe66d}.btn,button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.btn{background:linear-gradient(135deg,#ffe66d,#ffb703);color:#172033}.muted{color:#cbd5e1}.result{font-size:20px;font-weight:900;color:#ffe66d}.credit{text-align:center;color:#cbd5e1;font-size:12px;margin:18px}</style><style>.phrase{text-align:center;font-size:38px;font-weight:1000;color:#ffe66d}.pt{text-align:center;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spoken{padding:14px;background:#ffffff12;border-radius:14px;margin-top:12px}.ok{color:#4ade80}.bad{color:#fca5a5}</style><div class="wrap"><div class="top"><a class="back" href="index.html">← HUB</a><b id="hud">1/40</b></div><div class="card"><h1>🎙️ Desafio da Pronúncia</h1><p class="muted">O mesmo vocabulário do jogo de combinação.</p><div class="phrase" id="phrase"></div><div class="pt" id="pt"></div><div class="actions"><button class="btn" onclick="listen()">🔊 OUVIR</button><button class="btn" onclick="speak()">🎙️ FALAR</button></div><div class="spoken" id="spoken">Clique em FALAR e pronuncie a palavra ou expressão.</div><button class="btn" style="width:100%;margin-top:12px" onclick="next()">PRÓXIMA ▶</button></div></div><script>const B=[["mother","mãe"],["father","pai"],["sister","irmã"],["brother","irmão"],["grandmother","avó"],["grandfather","avô"],["aunt","tia"],["uncle","tio"],["cousin","primo / prima"],["living room","sala de estar"],["bedroom","quarto"],["bathroom","banheiro"],["kitchen","cozinha"],["dining room","sala de jantar"],["laundry room","lavanderia"],["hallway","corredor"],["front yard","área da frente"],["backyard","quintal dos fundos"],["garden","jardim"],["garage","garagem"],["gate","portão"],["roof","telhado"],["wall","parede / muro"],["balcony","varanda"],["sofa","sofá"],["bed","cama"],["table","mesa"],["chair","cadeira"],["fridge","geladeira"],["stove","fogão"],["sink","pia"],["shower","chuveiro"],["window","janela"],["door","porta"],["desk","escrivaninha"],["lamp","lâmpada / abajur"],["house","casa"],["room","cômodo / quarto"],["family","família"],["home","lar / casa"]];let deck=[...B].sort(()=>Math.random()-.5),i=0,ok=0;function draw(){if(i>=deck.length){phrase.textContent='🏁 CONCLUÍDO';pt.textContent=ok+' reconhecimentos em '+deck.length;hud.textContent='FIM';return}phrase.textContent=deck[i][0];pt.textContent=deck[i][1];hud.textContent=(i+1)+'/40';spoken.textContent='Clique em FALAR e pronuncie.';spoken.className='spoken'}function listen(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(deck[i][0]);u.lang='en-US';speechSynthesis.speak(u)}function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,'').trim()}function speak(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){spoken.textContent='Este navegador não oferece reconhecimento de voz. Use Chrome/Edge.';return}let r=new SR;r.lang='en-US';r.interimResults=false;r.onresult=e=>{let heard=e.results[0][0].transcript;let good=norm(heard)===norm(deck[i][0])||norm(heard).includes(norm(deck[i][0]));spoken.textContent=(good?'✅ Reconhecido: ':'🔁 Ouvi: ')+heard;spoken.className='spoken '+(good?'ok':'bad');if(good)ok++};r.onerror=()=>spoken.textContent='Não consegui ouvir. Tente novamente.';r.start()}function next(){i++;draw()}draw()</script>
