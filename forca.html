<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forca — 6º Ano</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#17479b,#07142f 55%,#16042d);color:#fff;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{color:#fff;text-decoration:none;font-weight:900}.card{background:#0b1740e8;border:1px solid #ffffff25;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 16px 40px #0005}h1{color:#ffe66d}.btn,button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.btn{background:linear-gradient(135deg,#ffe66d,#ffb703);color:#172033}.muted{color:#cbd5e1}.result{font-size:20px;font-weight:900;color:#ffe66d}.credit{text-align:center;color:#cbd5e1;font-size:12px;margin:18px}</style><style>#word{font-size:32px;letter-spacing:8px;text-align:center;margin:25px}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.keys button:disabled{opacity:.3}.hint{text-align:center;font-size:20px}</style><div class="wrap"><div class="top"><a class="back" href="index.html">← HUB</a><b id="score">0 acertos</b></div><div class="card"><h1>🎯 Jogo da Forca</h1><div class="hint" id="hint"></div><div id="word"></div><p id="tries"></p><div class="keys" id="keys"></div><p class="result" id="msg"></p></div></div><script>const B=[["MOTHER","mãe"],["FATHER","pai"],["SISTER","irmã"],["BROTHER","irmão"],["AUNT","tia"],["UNCLE","tio"],["COUSIN","primo / prima"],["HOUSE","casa"],["ROOM","cômodo"],["HOME","lar"],["BEDROOM","quarto"],["BATHROOM","banheiro"],["KITCHEN","cozinha"],["GARDEN","jardim"],["GARAGE","garagem"],["SOFA","sofá"],["BED","cama"],["TABLE","mesa"],["CHAIR","cadeira"],["FRIDGE","geladeira"],["STOVE","fogão"],["SINK","pia"],["SHOWER","chuveiro"],["WINDOW","janela"],["DOOR","porta"],["BOOK","livro"],["BOX","caixa"],["BUS","ônibus"],["CITY","cidade"],["FAMILY","família"],["BABY","bebê"],["CLASS","turma"],["TOY","brinquedo"],["KEY","chave"],["READ","ler"],["WRITE","escrever"],["PLAY","jogar / brincar"],["STUDY","estudar"],["WATCH","assistir"],["EAT","comer"],["DRINK","beber"],["SLEEP","dormir"],["LISTEN","ouvir"],["DRAW","desenhar"],["AM","sou / estou"],["IS","é / está"],["ARE","são / estão"],["THERE","há / existe"],["MY","meu / minha"],["HE","ele"],["SHE","ela"],["BOOKS","livros"],["BOXES","caixas"],["CITIES","cidades"],["FAMILIES","famílias"],["CHAIRS","cadeiras"],["WINDOWS","janelas"],["HOUSES","casas"],["ROOMS","quartos"],["BABIES","bebês"]];let deck=[...B].sort(()=>Math.random()-.5).slice(0,15),i=0,ok=0,bad=0,seen=new Set;function cur(){return deck[i]}function draw(){if(i>=deck.length){msg.textContent='🏁 Final: '+ok+' palavras resolvidas • '+bad+' erros.';keys.innerHTML='';word.textContent='FIM';return}seen=new Set;bad=0;hint.textContent='Pista: '+cur()[1];render()}function render(){let w=cur()[0];word.textContent=[...w].map(c=>c===' '?' ':seen.has(c)?c:'_').join(' ');tries.textContent='Erros: '+bad+'/6';keys.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(c=>{let b=document.createElement('button');b.textContent=c;b.disabled=seen.has(c);b.onclick=()=>pick(c);keys.appendChild(b)});if([...w].filter(c=>c!==' ').every(c=>seen.has(c))){ok++;score.textContent=ok+' acertos';setTimeout(()=>{i++;draw()},650)}}function pick(c){seen.add(c);if(!cur()[0].includes(c))bad++;if(bad>=6){msg.textContent='Resposta: '+cur()[0];setTimeout(()=>{msg.textContent='';i++;draw()},1100)}else render()}draw()</script>
