<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show do Milhão — 6º Ano</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#17479b,#07142f 55%,#16042d);color:#fff;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#fff;text-decoration:none;font-weight:900}.card{background:#0b1740e8;border:1px solid #ffffff25;border-radius:22px;padding:16px;margin-top:12px}h1{color:#ffe66d}.btn,button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.btn{background:linear-gradient(135deg,#ffe66d,#ffb703);color:#172033}.result{font-size:18px;font-weight:900;color:#ffe66d}</style><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{text-align:center;background:#ffffff10;border-radius:12px;padding:8px}.stat b{display:block;color:#ffe66d}.prompt{font-size:23px;font-weight:900;margin:16px 0}.opts{display:grid;gap:8px}.opts button{text-align:left;background:#fff;color:#172033}.helps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.helps button{background:#c4b5fd}.good{background:#4ade80!important}.bad{background:#fca5a5!important}.prize{font-size:24px;text-align:center;color:#ffe66d;font-weight:1000}</style><div class="wrap"><div class="top"><a class="back" href="index.html">← HUB</a><b>6º ANO</b></div><div class="card"><h1>🏆 Show do Milhão</h1><div class="stats"><div class="stat"><b id="num">1</b><span>QUESTÃO</span></div><div class="stat"><b id="ok">0</b><span>ACERTOS</span></div><div class="stat"><b id="err">0</b><span>ERROS</span></div><div class="stat"><b id="pts">0</b><span>PONTOS</span></div></div><div class="prize" id="level"></div><div class="helps"><button id="half" onclick="fifty()">50/50</button><button id="skip" onclick="skipQ()">PULAR</button></div><div id="theme"></div><div class="prompt" id="prompt"></div><div class="opts" id="opts"></div><p class="result" id="fb"></p></div></div><script>const Q=[["There is / There are","Complete: _____ a bed in the bedroom.",["There is","There are","Is there","Are there"],0],["There is / There are","Complete: _____ two chairs in the kitchen.",["There are","There is","Is there","Are there"],0],["There is / There are","Complete: _____ a sofa in the living room.",["There is","There are","Are there","There"],0],["Plural","Pedro escreveu BOOKS como “bookes”. Qual é a correção?",["books","bookes","bookies","bookses"],0],["Plural","Ana escreveu BOX no plural como “boxs”. Qual é a correção?",["boxes","boxs","boxies","boxeses"],0],["Plural","Lucas escreveu FAMILY no plural como “familys”. Qual é a correção?",["families","familys","familyes","familis"],0],["Plural","Carla escreveu CITY no plural como “citys”. Qual é a correção?",["cities","citys","cityes","citis"],0],["Plural","A forma “windowes” está errada. Qual é o plural correto de WINDOW?",["windows","windowes","windowies","windowses"],0],["Present Continuous","Complete: I _____ studying now.",["am","is","are","be"],0],["Present Continuous","Complete: She _____ reading a book.",["is","am","are","be"],0],["Present Continuous","Complete: They _____ watching TV.",["are","is","am","be"],0],["Present Continuous","Complete: She is _____ a book.",["reading","read","reads","reader"],0],["Present Continuous","Qual frase está completa e correta?",["They are playing in the garden.","They playing in the garden.","They is playing in the garden.","They are play in the garden."],0],["Present Continuous","O que falta em “She cooking now”?",["is","am","are","-s"],0],["Present Continuous","Em “I is studying”, qual é a correção?",["I am studying.","I are studying.","I studying.","I is study."],0],["Present Continuous","Qual estrutura representa o Present Continuous afirmativo?",["subject + am/is/are + verb-ing","subject + verb","am/is/are + subject + verb","subject + do/does + verb"],0],["Family","“mother” significa:",["mãe","pai","irmã","tia"],0],["Family","“brother” significa:",["irmão","primo","pai","avô"],0],["Family","“aunt” significa:",["tia","irmã","avó","prima"],0],["Family","“cousin” pode significar:",["primo ou prima","apenas irmão","apenas tio","pai ou mãe"],0],["Genitive case","Para dizer “a mãe de Ana”, qual está correta?",["Ana's mother","mother Ana's","Ana mother","Anas mother"],0],["Genitive case","Para dizer “o pai de Pedro”, qual está correta?",["Pedro's father","father's Pedro","Pedro father","Pedros father"],0],["Genitive case","Onde colocamos o 's no caso genitivo estudado?",["Depois do nome da pessoa","Antes do nome da pessoa","Depois do familiar","No final da frase"],0],["Genitive case","Complete: o irmão de Sofia = Sofia's _____.",["brother","mother","uncle","cousin"],0],["Genitive case","“Laura's brother” significa:",["o irmão de Laura","a irmã de Laura","o pai de Laura","Laura é irmã"],0],["Genitive case","Qual expressão está escrita corretamente?",["Rafael's father","Rafael father","Rafaels father","father Rafael's"],0]];let deck=[...Q].sort(()=>Math.random()-.5).slice(0,15),i=0,c=0,w=0,score=0,active=null,halfUsed=false,skipUsed=false;function draw(){if(i>=deck.length){prompt.textContent='🎉 FIM DO SHOW!';theme.textContent='';opts.innerHTML='';level.textContent='Resultado: '+score+' pontos';fb.textContent=c+' acertos • '+w+' erros';return}active=deck[i];num.textContent=(i+1)+'/15';ok.textContent=c;err.textContent=w;pts.textContent=score;level.textContent='Valendo '+((i+1)*100)+' pontos';theme.textContent='Tema: '+active[0];prompt.textContent=active[1];let arr=active[2].map((t,j)=>({t,good:j===active[3]})).sort(()=>Math.random()-.5);opts.innerHTML='';arr.forEach(z=>{let b=document.createElement('button');b.textContent=z.t;b.dataset.good=z.good;b.onclick=()=>ans(z.good,b);opts.appendChild(b)})}function ans(g,b){[...opts.children].forEach(x=>x.disabled=true);if(g){c++;score+=(i+1)*100;b.classList.add('good');fb.textContent='✅ RESPOSTA CERTA!'}else{w++;b.classList.add('bad');[...opts.children].find(x=>x.dataset.good==='true')?.classList.add('good');fb.textContent='❌ RESPOSTA INCORRETA.'}setTimeout(()=>{i++;fb.textContent='';draw()},1000)}function fifty(){if(halfUsed)return;halfUsed=true;half.disabled=true;let bad=[...opts.children].filter(x=>x.dataset.good==='false').sort(()=>Math.random()-.5);bad.slice(0,2).forEach(x=>x.style.display='none')}function skipQ(){if(skipUsed)return;skipUsed=true;skip.disabled=true;deck.push(active);i++;draw()}draw()</script>
